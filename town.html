<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>JNBTeam - 敏捷看板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f4f5f7;color:#172b4d;font-family:-apple-system,'Segoe UI',Roboto,'Microsoft YaHei',sans-serif;font-size:14px;height:100vh;overflow:hidden;user-select:none}

.jr-top{background:#fff;border-bottom:1px solid #dfe1e6;height:48px;display:flex;align-items:center;padding:0 16px;gap:14px}
.jr-logo{display:flex;align-items:center;gap:8px;font-weight:600;color:#172b4d}
.jr-logo .sq{width:24px;height:24px;background:linear-gradient(135deg,#2684ff,#0052cc);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.jr-nav{display:flex;gap:18px;color:#42526e;font-size:14px;margin-left:10px}
.jr-right{margin-left:auto;display:flex;gap:12px;align-items:center;color:#42526e}
.jr-avatar{width:28px;height:28px;border-radius:50%;background:#0052cc;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}

.jr-head{background:#fff;padding:10px 20px 0}
.jr-crumb{font-size:12px;color:#5e6c84}
.jr-title{font-size:20px;font-weight:600;margin:4px 0 10px;display:flex;align-items:center;gap:12px}
.jr-sprint{font-size:12px;background:#e9f2ff;color:#0052cc;padding:2px 8px;border-radius:3px;font-weight:400}

.jr-stats{display:flex;gap:18px;padding:8px 20px;background:#fff;border-bottom:1px solid #dfe1e6;font-size:13px;flex-wrap:wrap}
.jr-stat{display:flex;align-items:center;gap:5px;color:#42526e}
.jr-stat b{color:#172b4d;font-size:15px}
.jr-stat .ico{font-size:15px}
.jr-stat.hl b{color:#0052cc}

.board{display:flex;gap:12px;padding:16px 20px;overflow-x:auto;height:calc(100vh - 48px - 92px - 42px)}
.col{background:#f1f2f4;border-radius:6px;width:260px;flex-shrink:0;display:flex;flex-direction:column;max-height:100%}
.col-head{padding:10px 12px;font-size:12px;font-weight:600;color:#5e6c84;text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between}
.col-body{padding:0 8px 8px;overflow-y:auto;flex:1}

.card{background:#fff;border-radius:5px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 1px rgba(9,30,66,.2);cursor:pointer;position:relative}
.card:hover{background:#f7f8f9}
.card .ctitle{font-size:14px;margin-bottom:8px;color:#172b4d;display:flex;justify-content:space-between;align-items:center}
.card .cico{font-size:16px;margin-right:5px}
.card .lvl{font-size:11px;background:#eae6ff;color:#5243aa;padding:1px 6px;border-radius:3px;font-weight:600}
.card .cmeta{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#5e6c84}
.card .tag{font-size:11px;padding:1px 6px;border-radius:3px;font-weight:600}
.tag-story{background:#e9f2ff;color:#0052cc}
.tag-task{background:#e3fcef;color:#006644}
.tag-idle{background:#dfe1e6;color:#42526e}
.tag-block{background:#ffebe6;color:#bf2600}
.card .assignee{width:22px;height:22px;border-radius:50%;background:#6554c0;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.card .flow{font-size:11px;color:#42526e;margin-top:7px;line-height:1.5}
.card .flow .in{color:#bf2600}.card .flow .out{color:#006644}
.card .buff{font-size:11px;margin-top:6px;padding:2px 6px;border-radius:3px}
.card .buff.hit{background:#e3fcef;color:#006644;font-weight:600}
.card .buff.miss{background:#f4f5f7;color:#97a0af}
.card .progress{height:4px;background:#dfe1e6;border-radius:2px;margin-top:7px;overflow:hidden}
.card .progress .bar{height:100%;background:#0052cc;width:0%;transition:width .3s}
.card.blocked .progress .bar{background:#ff8b00}
.card .upg{margin-top:8px;font-size:11px;color:#0052cc;border:1px solid #b3d4ff;background:#deebff;padding:3px 6px;border-radius:3px;display:inline-block;cursor:pointer}
.card .upg:hover{background:#b3d4ff}

.add-card{padding:8px 12px;color:#5e6c84;font-size:13px;cursor:pointer;border-radius:5px}
.add-card:hover{background:#e4e6ea;color:#172b4d}

.modal-bg{position:fixed;inset:0;background:rgba(9,30,66,.54);z-index:100;display:none;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:6px;width:480px;max-width:92vw;max-height:88vh;overflow:auto;box-shadow:0 8px 30px rgba(9,30,66,.4)}
.modal-head{padding:14px 20px;border-bottom:1px solid #dfe1e6;font-size:12px;color:#5e6c84;display:flex;justify-content:space-between}
.modal-body{padding:18px 20px}
.modal-body h2{font-size:18px;margin-bottom:6px;color:#172b4d}
.modal-body .sub{font-size:12px;color:#5e6c84;margin-bottom:14px}
.shop{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid #dfe1e6;border-radius:5px;margin-bottom:8px}
.shop .sico{font-size:26px}
.shop .sinfo{flex:1}
.shop .sname{font-weight:600}
.shop .sdesc{font-size:12px;color:#5e6c84;margin-top:2px}
.shop .sflow{font-size:11px;margin-top:3px}
.shop .sflow .in{color:#bf2600}.shop .sflow .out{color:#006644}
.shop .buy{background:#0052cc;color:#fff;border:none;padding:6px 14px;border-radius:3px;cursor:pointer;font-size:13px;white-space:nowrap}
.shop .buy:disabled{background:#dfe1e6;color:#a5adba;cursor:not-allowed}
.close-x{cursor:pointer;font-size:16px;color:#5e6c84}
.assign-item{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid #dfe1e6;border-radius:5px;margin-bottom:6px;cursor:pointer}
.assign-item:hover{background:#f4f5f7}
.assign-item.busy{opacity:.5;cursor:not-allowed}
.assign-item .av{width:30px;height:30px;border-radius:50%;background:#6554c0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.btn{background:#0052cc;color:#fff;border:none;padding:8px 16px;border-radius:3px;cursor:pointer;font-size:14px}
.btn.sec{background:#f4f5f7;color:#42526e;border:1px solid #dfe1e6}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172b4d;color:#fff;padding:10px 18px;border-radius:4px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.offline-note{background:#e3fcef;border:1px solid #abf5d1;color:#006644;padding:8px 12px;border-radius:5px;font-size:13px;margin:10px 20px 0}
</style>
</head>
<body>

<div class="jr-top">
  <div class="jr-logo"><div class="sq">J</div>Jira</div>
  <div class="jr-nav"><span>你的工作</span><span>项目</span><span>筛选器</span><span>仪表板</span></div>
  <div class="jr-right"><span>🔍</span><span>❓</span><div class="jr-avatar">ZF</div></div>
</div>

<div class="jr-head">
  <div class="jr-crumb">项目 / 江南营造 / 看板</div>
  <div class="jr-title">JNB Sprint 看板 <span class="jr-sprint" id="sprintLabel">Sprint 1 · 运营中</span></div>
</div>

<div class="jr-stats" id="statsBar"></div>

<div class="offline-note" id="offlineNote" hidden></div>

<div class="board" id="board"></div>

<div class="modal-bg" id="shopModal">
  <div class="modal">
    <div class="modal-head"><span>新建工作项 · 立项</span><span class="close-x" data-close>✕</span></div>
    <div class="modal-body">
      <h2>选择要营造的产业</h2>
      <div class="sub">🔴 括号内是消耗的原料，🟢 是产出。加工类没原料会停工。</div>
      <div id="shopList"></div>
    </div>
  </div>
</div>

<div class="modal-bg" id="assignModal">
  <div class="modal">
    <div class="modal-head"><span>分配负责人</span><span class="close-x" data-close>✕</span></div>
    <div class="modal-body">
      <h2 id="assignTitle">分配负责人</h2>
      <div id="assignList"></div>
      <div style="margin-top:12px;text-align:right"><button class="btn sec" data-close>取消</button></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

var SAVE_KEY = 'jiangnan_town_save_v2';

// —— 资源定义(带图标) ——
var RES = {
  coin:{ico:'💰',name:'铜钱'}, food:{ico:'🌾',name:'米粮'}, wood:{ico:'🪵',name:'木材'},
  silk:{ico:'🧶',name:'蚕丝'}, cloth:{ico:'🧵',name:'布匹'}, snack:{ico:'🍵',name:'茶点'}, china:{ico:'🏺',name:'瓷器'}
};

// —— 建筑定义 ——
// input: 每周期消耗；output: 每周期产出；cycle 秒
// 原料层 input 为空(直接产)；加工层有 input，缺料则停工
var BUILDINGS = {
  farm:  {name:'米铺', ico:'🌾', cat:'raw', desc:'派人耕作，直接产出米粮', cost:{wood:15},
          input:{}, output:{food:8}, cycle:10, tag:'原料'},
  mill:  {name:'桑园', ico:'🧶', cat:'raw', desc:'养蚕缫丝，直接产出蚕丝', cost:{wood:20,food:15},
          input:{}, output:{silk:6}, cycle:12, tag:'原料'},
  wood:  {name:'木场', ico:'🪵', cat:'raw', desc:'伐木备料，直接产出木材', cost:{coin:30,food:20},
          input:{}, output:{wood:10}, cycle:12, tag:'原料'},
  loom:  {name:'织坊', ico:'🧵', cat:'craft', desc:'蚕丝织成布匹', cost:{coin:40,wood:20},
          input:{silk:6}, output:{cloth:4}, cycle:12, tag:'加工'},
  tea:   {name:'茶馆', ico:'🍵', cat:'craft', desc:'米粮制成茶点待客', cost:{coin:50,wood:25},
          input:{food:10}, output:{snack:4}, cycle:12, tag:'加工'},
  kiln:  {name:'窑厂', ico:'🏺', cat:'craft', desc:'木材烧窑产出瓷器', cost:{coin:80,wood:40},
          input:{wood:12}, output:{china:3}, cycle:15, tag:'加工'},
  market:{name:'集市', ico:'🏮', cat:'sell', desc:'布匹/茶点/瓷器 售卖换铜钱', cost:{coin:120,wood:50,food:40},
          input:{cloth:2,snack:2}, output:{coin:60}, cycle:14, tag:'变现'},
  guild: {name:'商号', ico:'🏦', cat:'sell', desc:'瓷器高端外销，铜钱大量进账', cost:{coin:300,wood:100,china:10},
          input:{china:3}, output:{coin:150}, cycle:16, tag:'变现'},
  house: {name:'民居', ico:'🏠', cat:'none', desc:'招徕居民，永久增加一名成员', cost:{coin:60,wood:30,food:30},
          input:{}, output:{}, cycle:0, tag:'人口', once:true}
};

// —— 角色专长 ——
// bonus 作用于建筑类别 cat：raw/craft/sell；single 指定单个建筑 type，享受更高加成
// mult 是产出倍率（1.5 = +50%），只加产出、不加原料消耗
var TALENTS = {
  '文徵明':{label:'账房先生',cat:'sell',  mult:1.5, tip:'善经营算账'},
  '沈万三':{label:'江南首富',cat:'sell',  mult:1.8, tip:'富可敌国'},
  '李时珍':{label:'本草大家',cat:'raw',   mult:1.5, tip:'精于田产药材'},
  '徐霞客':{label:'游历家',  cat:'raw',   mult:1.5, tip:'踏遍山川识物产'},
  '唐伯虎':{label:'江南才子',cat:'craft', mult:1.5, tip:'心灵手巧'},
  '汤显祖':{label:'戏曲名家',cat:'craft', mult:1.5, tip:'匠心独运'},
  '董小宛':{label:'茶艺名伶',single:'tea',   mult:2.0, tip:'烹茶一绝'},
  '柳如是':{label:'织造圣手',single:'loom',  mult:2.0, tip:'织锦冠绝江南'},
  '郑板桥':{label:'瓷画大师',single:'kiln',  mult:2.0, tip:'窑火独到'},
  '曹雪芹':{label:'织造世家',cat:'craft', mult:1.6, tip:'出身江宁织造'},
  '祝枝山':{label:'书画商',  cat:'sell',  mult:1.5, tip:'善鬻字画'},
  '归有光':{label:'田园文人',cat:'raw',   mult:1.4, tip:'耕读传家'},
  '海瑞':  {label:'清廉能吏',cat:'sell',  mult:1.4, tip:'理财有方'},
  '蒲松龄':{label:'乡野先生',cat:'raw',   mult:1.4, tip:'熟知乡土'}
};
function talentOf(name){ return TALENTS[name] || {label:'普通居民',mult:1.0,tip:'暂无专长'}; }
// 给定角色 + 建筑，算加成倍率
function bonusFor(name, def){
  var t=talentOf(name);
  if(t.single && t.single===typeKeyOf(def)) return t.mult;
  if(t.cat && t.cat===def.cat) return t.mult;
  return 1.0;
}
// 反查 def 的 type key
function typeKeyOf(def){ for(var k in BUILDINGS) if(BUILDINGS[k]===def) return k; return null; }

var NAME_POOL = Object.keys(TALENTS);

var state = null;

function defaultState(){
  return {
    res:{coin:60, food:40, wood:50, silk:0, cloth:0, snack:0, china:0},
    level:1,
    workers:[{name:'文徵明',busy:null},{name:'李时珍',busy:null}],
    buildings:[],
    nextId:1,
    lastSave:Date.now()
  };
}

function load(){
  try{ var raw=localStorage.getItem(SAVE_KEY); if(raw){state=JSON.parse(raw);return true;} }catch(e){}
  state=defaultState(); return false;
}
function save(){ try{state.lastSave=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){} }

function lvlMult(b){ return b.level||1; } // 等级倍率：产出/消耗都 ×等级

// —— 尝试跑一个建筑一个周期(返回是否成功产出) ——
function runCycle(b){
  var def=BUILDINGS[b.type];
  if(!def.cycle) return false;
  var mult=lvlMult(b);
  // 检查原料(消耗只随等级，不随专长)
  for(var k in def.input){
    if(state.res[k] < def.input[k]*mult) return false; // 缺料
  }
  // 负责人专长加成(只加产出)
  var bonus=1.0;
  if(b.assignee!==null && state.workers[b.assignee]) bonus=bonusFor(state.workers[b.assignee].name, def);
  // 扣原料
  for(var k in def.input) state.res[k] -= def.input[k]*mult;
  // 加产出(乘等级 × 专长，向下取整避免小数堆积)
  for(var k in def.output) state.res[k] += Math.floor(def.output[k]*mult*bonus);
  return true;
}

// —— 离线结算 ——
function settleOffline(){
  var now=Date.now();
  var elapsed=Math.floor((now-(state.lastSave||now))/1000);
  if(elapsed<5) return null;
  elapsed=Math.min(elapsed,60*60*8);
  var before={}; for(var k in state.res) before[k]=state.res[k];
  // 简化：对每个已派人建筑，按能跑多少周期跑多少(受原料限制，循环模拟)
  // 为避免长循环，按周期数上限迭代
  state.buildings.forEach(function(b){
    var def=BUILDINGS[b.type];
    if(!def.cycle||b.assignee===null) return;
    var cycles=Math.floor(elapsed/def.cycle);
    // 原料层无消耗，直接乘(带专长加成)
    if(Object.keys(def.input).length===0){
      var mult=lvlMult(b);
      var bonus=(b.assignee!==null&&state.workers[b.assignee])?bonusFor(state.workers[b.assignee].name,def):1.0;
      for(var k in def.output) state.res[k]+=Math.floor(def.output[k]*mult*bonus)*cycles;
    }
  });
  // 加工/变现层：受原料限制，逐周期模拟(上限较小，够用)
  var maxIter=Math.min(elapsed,3000);
  for(var t=0;t<maxIter;t++){
    state.buildings.forEach(function(b){
      var def=BUILDINGS[b.type];
      if(!def.cycle||b.assignee===null) return;
      if(Object.keys(def.input).length===0) return; // 原料层已算
      if(!b._offAcc) b._offAcc=0;
      b._offAcc++;
      if(b._offAcc>=def.cycle){ b._offAcc=0; runCycle(b); }
    });
  }
  state.buildings.forEach(function(b){delete b._offAcc;});
  var gain={};
  for(var k in state.res){ var d=state.res[k]-before[k]; if(d>0.5) gain[k]=Math.floor(d); }
  return Object.keys(gain).length?gain:null;
}

// —— 在线生产 tick ——
function productionTick(){
  var now=Date.now();
  state.buildings.forEach(function(b){
    var def=BUILDINGS[b.type];
    if(!def.cycle||b.assignee===null) return;
    if(!b.lastTick) b.lastTick=now;
    if(now-b.lastTick >= def.cycle*1000){
      b.lastTick=now;
      b.blocked = !runCycle(b);
    }
  });
  updateResources(); renderBoard();
}

function updateResources(){
  var order=['coin','food','wood','silk','cloth','snack','china'];
  var html='';
  order.forEach(function(k){
    html+='<div class="jr-stat'+(k==='coin'?' hl':'')+'"><span class="ico">'+RES[k].ico+'</span>'+RES[k].name+'：<b>'+Math.floor(state.res[k])+'</b></div>';
  });
  html+='<div class="jr-stat"><span class="ico">👥</span>成员：<b>'+state.workers.length+'</b></div>';
  html+='<div class="jr-stat" style="margin-left:auto"><span class="ico">⭐</span>迭代 <b>'+state.level+'</b></div>';
  document.getElementById('statsBar').innerHTML=html;
  document.getElementById('sprintLabel').textContent='Sprint '+state.level+' · 运营中';
}

function flowStr(def, mult){
  mult=mult||1;
  var ins=[],outs=[];
  for(var k in def.input) ins.push(RES[k].ico+def.input[k]*mult);
  for(var k in def.output) outs.push(RES[k].ico+def.output[k]*mult);
  var s='';
  if(ins.length) s+='<span class="in">耗 '+ins.join(' ')+'</span>';
  if(ins.length&&outs.length) s+=' → ';
  if(outs.length) s+='<span class="out">产 '+outs.join(' ')+'</span>';
  return s;
}

function renderBoard(){
  var running=[],todo=[];
  state.buildings.forEach(function(b,i){ (b.assignee!==null?running:todo).push({b:b,i:i}); });
  var html='';

  html+='<div class="col"><div class="col-head"><span>待办 · TO DO</span><span>'+todo.length+'</span></div><div class="col-body">';
  todo.forEach(function(o){ html+=cardHtml(o.b,o.i,false); });
  html+='<div class="add-card" data-shop>＋ 新建工作项</div>';
  html+='</div></div>';

  html+='<div class="col"><div class="col-head"><span>进行中 · IN PROGRESS</span><span>'+running.length+'</span></div><div class="col-body">';
  running.forEach(function(o){ html+=cardHtml(o.b,o.i,true); });
  html+='</div></div>';

  html+='<div class="col"><div class="col-head"><span>团队 · TEAM</span><span>'+state.workers.length+'</span></div><div class="col-body">';
  state.workers.forEach(function(w){
    var free=w.busy===null;
    var t=talentOf(w.name);
    var catName={raw:'原料产业',craft:'加工产业',sell:'变现产业'}[t.cat];
    var expertise = t.single ? ('专精'+BUILDINGS[t.single].name) : (catName?(catName+' +'+Math.round((t.mult-1)*100)+'%'):'无专长');
    html+='<div class="card"><div class="ctitle">👤 '+w.name+'</div>'+
      '<div class="buff hit" style="margin-top:0;margin-bottom:6px">🎯 '+t.label+'　'+expertise+(t.single?(' +'+Math.round((t.mult-1)*100)+'%'):'')+'</div>'+
      '<div class="cmeta"><span class="tag '+(free?'tag-idle':'tag-task')+'">'+(free?'空闲':'处理中')+'</span>'+
      '<div class="assignee">'+initials(w.name)+'</div></div></div>';
  });
  html+='<div class="add-card" data-shop-house>＋ 招募成员(建民居)</div>';
  html+='</div></div>';

  document.getElementById('board').innerHTML=html;
}

function cardHtml(b,idx,isRunning){
  var def=BUILDINGS[b.type], mult=lvlMult(b);
  var assignee=b.assignee!==null&&state.workers[b.assignee]?state.workers[b.assignee]:null;
  var blocked=isRunning&&b.blocked;
  var tagcls,tagtxt;
  if(!isRunning){tagcls='tag-story';tagtxt=def.tag;}
  else if(blocked){tagcls='tag-block';tagtxt='⏸ 缺原料';}
  else{tagcls='tag-task';tagtxt='进行中';}

  var h='<div class="card '+(blocked?'blocked':'')+'" data-card="'+idx+'">';
  h+='<div class="ctitle"><span><span class="cico">'+def.ico+'</span>'+def.name+'</span><span class="lvl">Lv'+mult+'</span></div>';
  h+='<div class="cmeta"><span class="tag '+tagcls+'">'+tagtxt+'</span>';
  h+=assignee?'<div class="assignee" title="'+assignee.name+'">'+initials(assignee.name)+'</div>':'<span style="font-size:11px;color:#5e6c84">未分配</span>';
  h+='</div>';
  // 负责人专长匹配提示
  if(assignee){
    var t=talentOf(assignee.name), bn=bonusFor(assignee.name,def);
    if(bn>1) h+='<div class="buff hit">✨ '+assignee.name+' · '+t.label+'　产出 +'+Math.round((bn-1)*100)+'%</div>';
    else h+='<div class="buff miss">'+assignee.name+' · '+t.label+'（专长不符，无加成）</div>';
  }
  h+='<div class="flow">'+flowStr(def,mult)+' <span style="color:#97a0af">/'+def.cycle+'s</span></div>';
  if(isRunning){
    var elapsed=(Date.now()-(b.lastTick||Date.now()))/1000;
    var pct=Math.min(100,elapsed/def.cycle*100);
    h+='<div class="progress"><div class="bar" style="width:'+pct+'%"></div></div>';
    // 升级按钮
    var upCost=upgradeCost(b);
    h+='<span class="upg" data-upg="'+idx+'">⬆ 升到 Lv'+(mult+1)+'（💰'+upCost.coin+' 🪵'+upCost.wood+'）</span>';
  }
  h+='</div>';
  return h;
}

function upgradeCost(b){
  var lv=lvlMult(b);
  return {coin: 50*lv*lv, wood: 30*lv};
}

function initials(n){ return n.length<=2?n:n.slice(0,2); }

// —— 商店 ——
function openShop(onlyHouse){
  var list=document.getElementById('shopList');
  var html='';
  for(var type in BUILDINGS){
    if(onlyHouse && type!=='house') continue;
    var def=BUILDINGS[type];
    var costStr=[];
    for(var k in def.cost) costStr.push(RES[k].ico+def.cost[k]);
    var afford=canAfford(def.cost);
    html+='<div class="shop"><div class="sico">'+def.ico+'</div>';
    html+='<div class="sinfo"><div class="sname">'+def.name+' <span style="font-size:11px;color:#5e6c84;font-weight:400">· '+def.tag+'</span></div>';
    html+='<div class="sdesc">'+def.desc+'</div>';
    if(def.cycle) html+='<div class="sflow">'+flowStr(def,1)+'</div>';
    html+='<div class="sflow" style="color:#5e6c84;margin-top:2px">建造需 '+costStr.join(' ')+'</div>';
    html+='</div>';
    html+='<button class="buy" data-buy="'+type+'" '+(afford?'':'disabled')+'>建造</button></div>';
  }
  list.innerHTML=html;
  document.getElementById('shopModal').classList.add('show');
}

function canAfford(cost){ for(var k in cost) if(state.res[k]<cost[k]) return false; return true; }

function build(type){
  var def=BUILDINGS[type];
  if(!canAfford(def.cost)){ toast('资源不足'); return; }
  for(var k in def.cost) state.res[k]-=def.cost[k];

  if(def.once){
    var used=state.workers.map(function(w){return w.name;});
    var avail=NAME_POOL.filter(function(n){return used.indexOf(n)<0;});
    var nm=avail.length?avail[Math.floor(Math.random()*avail.length)]:('居民'+(state.workers.length+1));
    state.workers.push({name:nm,busy:null});
    var nt=talentOf(nm);
    toast('🎉 招募了新成员：'+nm+'（'+nt.label+' · '+nt.tip+'）');
  }else{
    state.buildings.push({id:state.nextId++,type:type,assignee:null,lastTick:Date.now(),level:1,blocked:false});
    toast('已立项：'+def.name+'（在"待办"点它派个负责人开工）');
  }
  state.level=1+Math.floor(state.buildings.length/3);
  save(); updateResources(); renderBoard();
  document.getElementById('shopModal').classList.remove('show');
}

function upgrade(idx){
  var b=state.buildings[idx];
  var cost=upgradeCost(b);
  if(state.res.coin<cost.coin||state.res.wood<cost.wood){ toast('升级资源不足（需 💰'+cost.coin+' 🪵'+cost.wood+'）'); return; }
  state.res.coin-=cost.coin; state.res.wood-=cost.wood;
  b.level=(b.level||1)+1;
  toast('⬆ '+BUILDINGS[b.type].name+' 升到 Lv'+b.level+'，产量翻倍！');
  save(); updateResources(); renderBoard();
}

// —— 派工 ——
var assignTarget=null;
function openAssign(idx){
  assignTarget=idx;
  var b=state.buildings[idx], def=BUILDINGS[b.type];
  document.getElementById('assignTitle').textContent='为「'+def.name+'」分配负责人';
  var list=document.getElementById('assignList');
  var html='';
  // 按对当前建筑的加成从高到低排，方便选最合适的
  var sorted=state.workers.map(function(w,wi){return {w:w,wi:wi};}).sort(function(a,bb){return bonusFor(bb.w.name,def)-bonusFor(a.w.name,def);});
  sorted.forEach(function(o){
    var w=o.w, wi=o.wi;
    var busy=w.busy!==null&&w.busy!==idx;
    var t=talentOf(w.name), bn=bonusFor(w.name,def);
    var buffTxt = bn>1 ? '<span style="color:#006644;font-weight:600">✨ '+t.label+' 加成 +'+Math.round((bn-1)*100)+'%</span>' : '<span style="color:#97a0af">'+t.label+'（不对口）</span>';
    html+='<div class="assign-item '+(busy?'busy':'')+'" '+(busy?'':'data-worker="'+wi+'"')+'>';
    html+='<div class="av">'+initials(w.name)+'</div>';
    html+='<div style="flex:1"><div style="font-weight:600">'+w.name+'　'+buffTxt+'</div>';
    html+='<div style="font-size:12px;color:#5e6c84">'+(busy?'处理中(已分配其他产业)':'空闲，可分配')+'</div></div></div>';
  });
  if(b.assignee!==null){
    html+='<div class="assign-item" data-worker="-1"><div class="av" style="background:#de350b">停</div>'+
      '<div><div style="font-weight:600">撤下负责人</div><div style="font-size:12px;color:#5e6c84">暂停该产业</div></div></div>';
  }
  list.innerHTML=html;
  document.getElementById('assignModal').classList.add('show');
}

function assign(workerIdx){
  var b=state.buildings[assignTarget];
  if(b.assignee!==null&&state.workers[b.assignee]) state.workers[b.assignee].busy=null;
  if(workerIdx===-1){ b.assignee=null; b.blocked=false; }
  else{
    var w=state.workers[workerIdx];
    if(w.busy!==null&&state.buildings[w.busy]) state.buildings[w.busy].assignee=null;
    b.assignee=workerIdx; b.lastTick=Date.now(); b.blocked=false; w.busy=assignTarget;
  }
  save(); updateResources(); renderBoard();
  document.getElementById('assignModal').classList.remove('show');
}

var toastTimer=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){t.classList.remove('show');},2600);
}

document.getElementById('board').addEventListener('click',function(e){
  if(e.target.closest('[data-shop-house]')){ openShop(true); return; }
  if(e.target.closest('[data-shop]')){ openShop(false); return; }
  var upg=e.target.closest('[data-upg]');
  if(upg){ e.stopPropagation(); upgrade(+upg.dataset.upg); return; }
  var card=e.target.closest('[data-card]');
  if(card){ openAssign(+card.dataset.card); }
});
document.getElementById('shopModal').addEventListener('click',function(e){
  if(e.target.dataset.close!==undefined||e.target===this){ this.classList.remove('show'); return; }
  var buy=e.target.closest('[data-buy]'); if(buy) build(buy.dataset.buy);
});
document.getElementById('assignModal').addEventListener('click',function(e){
  if(e.target.dataset.close!==undefined||e.target===this){ this.classList.remove('show'); return; }
  var w=e.target.closest('[data-worker]'); if(w) assign(+w.dataset.worker);
});

// —— 启动 ——
load();
var offlineGain=settleOffline();
if(offlineGain){
  var parts=[]; for(var k in offlineGain) parts.push(RES[k].ico+offlineGain[k]);
  if(parts.length){
    var note=document.getElementById('offlineNote');
    note.hidden=false;
    note.textContent='📊 离线期间团队持续产出：'+parts.join('  ')+'（已入账）';
  }
}
save(); updateResources(); renderBoard();

setInterval(productionTick,1000);
setInterval(save,5000);
window.addEventListener('beforeunload',save);
})();
</script>
</body>
</html>
