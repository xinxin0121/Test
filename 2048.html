<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Q3_budget_2026.xlsx - Excel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f3f2f1;color:#000;font-family:'Segoe UI',Calibri,Arial,sans-serif;font-size:14px;height:100vh;overflow:hidden;user-select:none}

/* Excel 顶部绿条 */
.xl-title{background:#217346;color:#fff;height:30px;display:flex;align-items:center;padding:0 12px;font-size:13px;gap:8px}
.xl-title .grid-ico{font-weight:700}

/* Ribbon 菜单 */
.xl-ribbon{background:#f3f2f1;border-bottom:1px solid #d4d4d4;height:28px;display:flex;align-items:center;padding:0 12px;gap:20px;font-size:13px;color:#444}
.xl-ribbon span{cursor:default}
.xl-ribbon .active{color:#217346;font-weight:600;border-bottom:2px solid #217346;padding-bottom:4px}

/* 名称框 + 编辑栏 */
.xl-formula{background:#fff;border-bottom:1px solid #d4d4d4;height:26px;display:flex;align-items:center;font-size:13px}
.xl-namebox{width:80px;border-right:1px solid #d4d4d4;padding:0 8px;height:100%;display:flex;align-items:center;color:#444}
.xl-fx{padding:0 10px;color:#888;font-style:italic}

/* 主体 */
.xl-main{display:flex;height:calc(100vh - 30px - 28px - 26px - 22px)}

/* 行号列 */
.grid-wrap{flex:1;overflow:auto;padding:0}

table.sheet{border-collapse:collapse;font-size:13px}
table.sheet th{background:#f3f2f1;border:1px solid #d4d4d4;color:#666;font-weight:400;text-align:center;height:20px;min-width:64px}
table.sheet th.corner{min-width:30px;width:30px}
table.sheet td.rownum{background:#f3f2f1;border:1px solid #d4d4d4;color:#666;text-align:center;width:30px;min-width:30px}
table.sheet td.cell{border:1px solid #d4d4d4;width:64px;height:52px;text-align:center;vertical-align:middle;background:#fff;font-weight:600;font-size:20px;transition:background .08s}

/* 数字配色（伪装成"金额"，但其实是 2048 方块颜色）*/
.v0{background:#fff;color:#fff}
.v2{background:#eef6f0;color:#217346}
.v4{background:#dcefe2;color:#217346}
.v8{background:#ffe9c7;color:#b5651d}
.v16{background:#ffd59e;color:#b5651d}
.v32{background:#ffbf87;color:#a04000}
.v64{background:#ffab6b;color:#fff}
.v128{background:#ffe066;color:#7a5c00}
.v256{background:#ffd633;color:#7a5c00}
.v512{background:#ffcc00;color:#7a5c00}
.v1024{background:#ffc300;color:#fff}
.v2048{background:#217346;color:#fff}
.vbig{background:#0b5c34;color:#fff}

/* 底部状态栏 */
.xl-status{background:#217346;color:#fff;height:22px;display:flex;align-items:center;padding:0 12px;font-size:12px;justify-content:space-between}
.xl-status .left,.xl-status .right{display:flex;gap:18px}

/* sheet tabs */
.xl-tabs{background:#f3f2f1;border-top:1px solid #d4d4d4;height:24px;display:flex;align-items:center;padding:0 8px;gap:2px;font-size:12px}
.xl-tab{padding:2px 12px;border:1px solid transparent;color:#444;cursor:default}
.xl-tab.active{background:#fff;border:1px solid #d4d4d4;border-bottom:none;color:#217346;font-weight:600}

/* 游戏提示 / 结束浮层 */
.game-msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;background:#fff;border:1px solid #217346;border-top:4px solid #217346;padding:22px 34px;box-shadow:0 8px 30px rgba(0,0,0,.25);text-align:center;font-size:14px;color:#333;display:none;border-radius:2px}
.game-msg.show{display:block}
.game-msg .t{font-size:16px;color:#217346;font-weight:700;margin-bottom:8px}
.game-msg kbd{background:#f3f2f1;border:1px solid #ccc;border-radius:3px;padding:1px 7px;font-family:inherit}
.game-msg .btn{margin-top:12px;background:#217346;color:#fff;border:none;padding:6px 18px;border-radius:3px;cursor:pointer;font-size:13px}
</style>
</head>
<body>

<!-- Excel 标题栏 -->
<div class="xl-title">
  <span class="grid-ico">📊</span>
  <span>Q3_budget_2026.xlsx - Excel</span>
</div>

<!-- Ribbon -->
<div class="xl-ribbon">
  <span>文件</span><span class="active">开始</span><span>插入</span><span>页面布局</span>
  <span>公式</span><span>数据</span><span>审阅</span><span>视图</span>
</div>

<!-- 编辑栏 -->
<div class="xl-formula">
  <div class="xl-namebox" id="nameBox">B2</div>
  <div class="xl-fx">fx</div>
  <div style="padding:0 10px;color:#333" id="formulaText">=SUM(revenue)</div>
</div>

<!-- 主体表格 -->
<div class="xl-main">
  <div class="grid-wrap">
    <table class="sheet" id="sheet"></table>
  </div>
</div>

<!-- 底部状态栏 -->
<div class="xl-tabs">
  <span class="xl-tab active">Q3预算</span>
  <span class="xl-tab">明细</span>
  <span class="xl-tab">汇总</span>
  <span style="color:#888;margin-left:6px">＋</span>
</div>
<div class="xl-status">
  <div class="left"><span>就绪</span></div>
  <div class="right"><span id="sumLabel">求和: 0</span><span>100%</span></div>
</div>

<!-- 结束浮层 -->
<div class="game-msg" id="gameMsg">
  <div class="t" id="msgTitle"></div>
  <div id="msgBody"></div>
  <button class="btn" id="restartBtn">重新计算</button>
</div>

<script>
(function(){
'use strict';

var SIZE = 4;
var board = [];        // 4x4 数字，0 表示空
var score = 0;
var over = false;
var won = false;

var sheetEl = document.getElementById('sheet');
var sumLabel = document.getElementById('sumLabel');
var nameBox = document.getElementById('nameBox');
var msg = document.getElementById('gameMsg');
var msgTitle = document.getElementById('msgTitle');
var msgBody = document.getElementById('msgBody');

// Excel 列标 A~D（游戏区），前面留几列假数据感
var COLS = ['A','B','C','D'];

function init() {
  board = [];
  for (var r = 0; r < SIZE; r++) {
    board[r] = [];
    for (var c = 0; c < SIZE; c++) board[r][c] = 0;
  }
  score = 0;
  over = false;
  won = false;
  addRandom();
  addRandom();
  render();
  msg.classList.remove('show');
}

function addRandom() {
  var empty = [];
  for (var r = 0; r < SIZE; r++)
    for (var c = 0; c < SIZE; c++)
      if (board[r][c] === 0) empty.push({r:r,c:c});
  if (empty.length === 0) return;
  var spot = empty[Math.floor(Math.random()*empty.length)];
  board[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
}

function clsFor(v) {
  if (v === 0) return 'v0';
  if (v <= 1024) return 'v'+v;
  if (v === 2048) return 'v2048';
  return 'vbig';
}

function render() {
  var html = '<tr><th class="corner"></th>';
  for (var c = 0; c < SIZE; c++) html += '<th>'+COLS[c]+'</th>';
  html += '</tr>';

  for (var r = 0; r < SIZE; r++) {
    html += '<tr><td class="rownum">'+(r+2)+'</td>';  // 从第2行开始，更像有表头的表
    for (var c = 0; c < SIZE; c++) {
      var v = board[r][c];
      html += '<td class="cell '+clsFor(v)+'">'+(v === 0 ? '' : v)+'</td>';
    }
    html += '</tr>';
  }
  sheetEl.innerHTML = html;
  sumLabel.textContent = '求和: ' + score.toLocaleString();
}

// —— 核心移动逻辑 ——
// 把一行向左压缩合并，返回 {row, gained, moved}
function slideRow(row) {
  var arr = row.filter(function(x){ return x !== 0; });
  var gained = 0;
  for (var i = 0; i < arr.length - 1; i++) {
    if (arr[i] === arr[i+1]) {
      arr[i] *= 2;
      gained += arr[i];
      if (arr[i] === 2048) won = true;
      arr.splice(i+1, 1);
    }
  }
  while (arr.length < SIZE) arr.push(0);
  var moved = false;
  for (var j = 0; j < SIZE; j++) if (row[j] !== arr[j]) moved = true;
  return {row: arr, gained: gained, moved: moved};
}

function moveLeft() {
  var moved = false;
  for (var r = 0; r < SIZE; r++) {
    var res = slideRow(board[r]);
    board[r] = res.row;
    score += res.gained;
    if (res.moved) moved = true;
  }
  return moved;
}

function rotateCW() {
  var n = [];
  for (var r = 0; r < SIZE; r++) { n[r] = []; for (var c = 0; c < SIZE; c++) n[r][c] = board[SIZE-1-c][r]; }
  board = n;
}

function move(dir) {
  if (over) return;
  // 通过旋转把所有方向都转成"向左"处理
  var rot = {left:0, up:3, right:2, down:1}[dir];
  for (var i = 0; i < rot; i++) rotateCW();
  var moved = moveLeft();
  for (var j = 0; j < (4 - rot) % 4; j++) rotateCW();

  if (moved) {
    addRandom();
    render();
    if (won) { showMsg('🎉 已达成 2048！', '目标达成，继续冲更大的数字，或点下方重来。'); won = false; }
    else if (isOver()) { over = true; showMsg('公式错误：表格已满', '得分 <b>'+score.toLocaleString()+'</b>，无法继续合并。'); }
  }
}

function isOver() {
  for (var r = 0; r < SIZE; r++)
    for (var c = 0; c < SIZE; c++) {
      if (board[r][c] === 0) return false;
      if (c < SIZE-1 && board[r][c] === board[r][c+1]) return false;
      if (r < SIZE-1 && board[r][c] === board[r+1][c]) return false;
    }
  return true;
}

function showMsg(title, body) {
  msgTitle.textContent = title;
  msgBody.innerHTML = body;
  msg.classList.add('show');
}

// —— 键盘 ——
document.addEventListener('keydown', function(e) {
  var map = {
    ArrowLeft:'left', a:'left', A:'left',
    ArrowRight:'right', d:'right', D:'right',
    ArrowUp:'up', w:'up', W:'up',
    ArrowDown:'down', s:'down', S:'down'
  };
  var dir = map[e.key];
  if (dir) { e.preventDefault(); move(dir); }
});

// —— 触屏滑动（手机也能玩）——
var tsx = null, tsy = null;
document.addEventListener('touchstart', function(e) {
  tsx = e.touches[0].clientX; tsy = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', function(e) {
  if (tsx === null) return;
  var dx = e.changedTouches[0].clientX - tsx;
  var dy = e.changedTouches[0].clientY - tsy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) > 30) {
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  }
  tsx = tsy = null;
}, {passive:true});

document.getElementById('restartBtn').addEventListener('click', init);

init();
})();
</script>
</body>
</html>
