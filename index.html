<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="老黄历" />
  <meta name="theme-color" content="#8a1f11" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <title>老黄历</title>
  <style>
    :root {
      --bg: #f3e9d8;
      --paper: #fbf5e9;
      --red: #8a1f11;
      --red-light: #b23a2a;
      --ink: #2b2b2b;
      --gray: #8a8073;
      --gold: #b8892b;
      --line: #e3d6bf;
      --good: #2e7d32;
      --bad: #c62828;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #efe4cf;
      color: var(--ink);
    }
    body {
      max-width: 480px; margin: 0 auto;
      min-height: 100vh;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      background: linear-gradient(180deg, #f6ecd8 0%, #efe1c6 100%);
    }
    .wrap { padding: 12px 14px 30px; }

    /* 顶部日期切换 */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 4px 12px;
    }
    .nav-btn {
      width: 40px; height: 40px; border: none; border-radius: 50%;
      background: rgba(138,31,17,.08); color: var(--red);
      font-size: 20px; line-height: 1; cursor: pointer;
    }
    .nav-btn:active { background: rgba(138,31,17,.2); }
    .today-btn {
      border: 1px solid var(--red); background: transparent; color: var(--red);
      border-radius: 16px; padding: 6px 14px; font-size: 14px; cursor: pointer;
    }
    .solar-date { text-align: center; }
    .solar-date .ymd { font-size: 15px; color: var(--gray); }
    .solar-date .week { font-size: 13px; color: var(--gray); margin-top: 2px; }

    /* 核心大日历卡片 */
    .card {
      background: var(--paper);
      border-radius: 18px;
      box-shadow: 0 6px 20px rgba(120,80,20,.12);
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .hero {
      background: linear-gradient(160deg, var(--red) 0%, var(--red-light) 100%);
      color: #fff; text-align: center; padding: 18px 16px 20px; position: relative;
    }
    .hero .big-day {
      font-size: 76px; font-weight: 700; line-height: 1; letter-spacing: 2px;
      text-shadow: 0 2px 6px rgba(0,0,0,.2);
    }
    .hero .lunar-main { font-size: 18px; margin-top: 8px; letter-spacing: 1px; }
    .hero .ganzhi { font-size: 13px; opacity: .9; margin-top: 8px; }
    .hero .term-badge {
      display: inline-block; margin-top: 8px; background: var(--gold);
      color: #fff; font-size: 13px; padding: 3px 12px; border-radius: 12px;
    }

    /* 宜忌 */
    .yiji { display: flex; }
    .yiji > div { flex: 1; padding: 16px 14px 18px; }
    .yiji .yi { border-right: 1px solid var(--line); }
    .yiji .tag {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 50%; color: #fff;
      font-size: 18px; font-weight: 700; margin-bottom: 8px;
    }
    .yiji .yi .tag { background: var(--good); }
    .yiji .ji .tag { background: var(--bad); }
    .yiji .label { font-size: 13px; color: var(--gray); margin-bottom: 6px; }
    .yiji .content { font-size: 15px; line-height: 1.7; color: var(--ink); word-break: break-all; }

    /* 详情信息网格 */
    .info-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
      background: var(--line); border-top: 1px solid var(--line);
    }
    .info-grid .item { background: var(--paper); padding: 12px 14px; }
    .info-grid .k { font-size: 12px; color: var(--gray); }
    .info-grid .v { font-size: 15px; margin-top: 3px; color: var(--ink); }

    .status {
      text-align: center; font-size: 13px; color: var(--gray);
      padding: 14px 10px 0;
    }
    .status.err { color: var(--bad); }
    .footer { text-align: center; font-size: 12px; color: var(--gray); margin-top: 18px; line-height: 1.6; }
    .loading { opacity: .5; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <button class="nav-btn" id="prevDay" aria-label="前一天">‹</button>
      <div class="solar-date">
        <div class="ymd" id="solarYmd">—</div>
        <div class="week" id="solarWeek">—</div>
      </div>
      <button class="nav-btn" id="nextDay" aria-label="后一天">›</button>
    </div>

    <div style="text-align:center;margin:-4px 0 12px">
      <button class="today-btn" id="todayBtn">回到今天</button>
    </div>

    <div class="card">
      <div class="hero">
        <div class="big-day" id="bigDay">—</div>
        <div class="lunar-main" id="lunarMain">农历 —</div>
        <div class="ganzhi" id="ganzhi">—</div>
        <div id="termWrap"></div>
      </div>

      <div class="yiji">
        <div class="yi">
          <div class="tag">宜</div>
          <div class="label">适宜</div>
          <div class="content" id="yiText">—</div>
        </div>
        <div class="ji">
          <div class="tag">忌</div>
          <div class="label">忌讳</div>
          <div class="content" id="jiText">—</div>
        </div>
      </div>

      <div class="info-grid">
        <div class="item"><div class="k">生肖</div><div class="v" id="animal">—</div></div>
        <div class="item"><div class="k">星期</div><div class="v" id="weekCn">—</div></div>
        <div class="item"><div class="k">冲煞</div><div class="v" id="chong">—</div></div>
        <div class="item"><div class="k">五行 / 值神</div><div class="v" id="wuxing">—</div></div>
      </div>
    </div>

    <div class="status" id="status"></div>

    <div class="footer">
      农历 · 干支 · 节气 由本地历法算法精确计算<br />
      宜忌 · 冲煞 来自联网接口，需网络连接
    </div>
  </div>

  <script src="lunar.js"></script>
  <script src="app.js"></script>
</body>
</html>
