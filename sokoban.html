<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>warehouse_layout.xlsx - Excel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f3f2f1;color:#000;font-family:'Segoe UI',Calibri,Arial,sans-serif;font-size:14px;height:100vh;overflow:hidden;user-select:none}

.xl-title{background:#217346;color:#fff;height:30px;display:flex;align-items:center;padding:0 12px;font-size:13px;gap:8px}
.xl-ribbon{background:#f3f2f1;border-bottom:1px solid #d4d4d4;height:28px;display:flex;align-items:center;padding:0 12px;gap:20px;font-size:13px;color:#444}
.xl-ribbon .active{color:#217346;font-weight:600;border-bottom:2px solid #217346;padding-bottom:4px}
.xl-formula{background:#fff;border-bottom:1px solid #d4d4d4;height:26px;display:flex;align-items:center;font-size:13px}
.xl-namebox{width:80px;border-right:1px solid #d4d4d4;padding:0 8px;height:100%;display:flex;align-items:center;color:#444}
.xl-fx{padding:0 10px;color:#888;font-style:italic}

.xl-main{display:flex;height:calc(100vh - 30px - 28px - 26px - 46px);align-items:flex-start}
.grid-wrap{padding:14px;overflow:auto}

table.sheet{border-collapse:collapse;font-size:13px}
table.sheet th{background:#f3f2f1;border:1px solid #d4d4d4;color:#666;font-weight:400;text-align:center;height:20px;width:44px}
table.sheet th.corner{width:28px}
table.sheet td.rownum{background:#f3f2f1;border:1px solid #d4d4d4;color:#666;text-align:center;width:28px}
table.sheet td.cell{border:1px solid #e6e6e6;width:44px;height:44px;text-align:center;vertical-align:middle;background:#fff;font-size:24px;line-height:1}
/* 墙=深色填充单元格；地板=白；目标=浅绿；箱子在目标上=深绿 */
td.wall{background:#3b3b3b;border-color:#2a2a2a}
td.floor{background:#fff}
td.goal{background:#e6f4ea}
td.boxok{background:#217346}
</style>
</head>
<body>

<div class="xl-title"><span>📊</span><span>warehouse_layout.xlsx - Excel</span></div>
<div class="xl-ribbon">
  <span>文件</span><span class="active">开始</span><span>插入</span><span>页面布局</span>
  <span>公式</span><span>数据</span><span>审阅</span><span>视图</span>
</div>
<div class="xl-formula">
  <div class="xl-namebox" id="nameBox">A1</div>
  <div class="xl-fx">fx</div>
  <div style="padding:0 10px;color:#333">=ARRANGE(pallet_range, target_slots)</div>
</div>

<div class="xl-main">
  <div class="grid-wrap"><table class="sheet" id="sheet"></table></div>
  <div class="pad" style="margin:14px 0 0 8px;display:flex;flex-direction:column;gap:12px;width:190px">
    <div style="font-size:13px;color:#444;line-height:1.9">
      关卡：<b id="levelNo" style="color:#217346">1</b> / <span id="levelTot">0</span><br>
      步数：<b id="moves" style="color:#217346">0</b><br>
      入位：<b id="onGoal" style="color:#217346">0</b> / <span id="goalTot">0</span>
    </div>
    <div style="display:flex;gap:4px">
      <button id="prevBtn" style="flex:1;height:28px;font-size:12px;border:1px solid #ccc;background:#fff;border-radius:4px;cursor:pointer;color:#444">◀ 上一关</button>
      <button id="nextBtn" style="flex:1;height:28px;font-size:12px;border:1px solid #ccc;background:#fff;border-radius:4px;cursor:pointer;color:#444">下一关 ▶</button>
    </div>
    <button id="undoBtn" style="height:32px;font-size:13px;background:#fff;border:1px solid #ccc;color:#444;border-radius:4px;cursor:pointer">↶ 撤销一步 (U)</button>
    <button id="resetBtn" style="height:36px;font-size:13px;background:#217346;color:#fff;border:none;border-radius:4px;cursor:pointer">↻ 重排本关 (R)</button>
    <div style="font-size:12px;color:#888;line-height:1.7">
      方向键 / WASD 移动📦搬运工<br>
      把所有 <b>📦</b> 推到 <b>🎯</b> 目标格<br>
      箱子只能推、不能拉<br>
      推错了按 U 撤销 或 R 重来
    </div>
  </div>
</div>

<div class="xl-tabs" style="background:#f3f2f1;border-top:1px solid #d4d4d4;height:24px;display:flex;align-items:center;padding:0 8px;gap:2px;font-size:12px">
  <span class="xl-tab active" style="padding:2px 12px;background:#fff;border:1px solid #d4d4d4;border-bottom:none;color:#217346;font-weight:600">布局</span>
  <span class="xl-tab" style="padding:2px 12px;color:#444">货位表</span>
  <span style="color:#888;margin-left:6px">＋</span>
</div>
<div class="xl-status" style="background:#217346;color:#fff;height:22px;display:flex;align-items:center;padding:0 12px;font-size:12px;justify-content:space-between">
  <div><span id="statusText">就绪</span></div>
  <div><span id="cellRef">整理中…</span></div>
</div>

<div class="game-msg" id="gameMsg" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;background:#fff;border-top:4px solid #217346;padding:22px 34px;box-shadow:0 8px 30px rgba(0,0,0,.25);text-align:center;display:none;border-radius:2px">
  <div class="t" style="font-size:16px;color:#217346;font-weight:700;margin-bottom:8px">✓ 货位整理完成</div>
  <div id="msgBody">所有托盘已归位。</div>
  <button id="okBtn" style="margin-top:12px;background:#217346;color:#fff;border:none;padding:6px 18px;border-radius:3px;cursor:pointer">下一关</button>
</div>

<script>
(function(){
'use strict';

// 图例：# 墙  . 地板  $ 箱子  * 箱子已在目标  @ 人  + 人站在目标  空格/  也当墙外
// 每关是字符串数组，手工设计，保证可解
// 关卡：全封闭矩形、行宽严格一致（空格=地板，#=墙，无歧义），逐关经 BFS 验证可解
var LEVELS = [
  [ // 1 一箱入门
    "#######",
    "#     #",
    "#  $  #",
    "#  @  #",
    "#  .  #",
    "#     #",
    "#######"
  ],
  [ // 2 两箱
    "#######",
    "#     #",
    "# . . #",
    "# $ $ #",
    "#  @  #",
    "#     #",
    "#######"
  ],
  [ // 3 拐一下
    "#######",
    "#   . #",
    "# $   #",
    "#  @  #",
    "#   $ #",
    "# .   #",
    "#######"
  ],
  [ // 4 三箱
    "########",
    "#      #",
    "# .  . #",
    "# $  $ #",
    "#  $   #",
    "# . @  #",
    "#      #",
    "########"
  ],
  [ // 5 挑战
    "########",
    "#      #",
    "# .$.$ #",
    "#  $   #",
    "# @ .  #",
    "#      #",
    "########"
  ]
];

var COLNAMES=['A','B','C','D','E','F','G','H','I','J','K','L'];

var grid=[];      // 静态层：0地板 1墙 2目标
var boxes=[];     // [{r,c}]
var player={r:0,c:0};
var rows=0, cols=0;
var moves=0, solved=false;
var levelIdx=0;
var history=[];   // 撤销栈：{player, boxes(浅拷贝), moves}

var sheetEl=document.getElementById('sheet');
var movesEl=document.getElementById('moves');
var onGoalEl=document.getElementById('onGoal');
var goalTotEl=document.getElementById('goalTot');
var levelNoEl=document.getElementById('levelNo');
var levelTotEl=document.getElementById('levelTot');
var statusText=document.getElementById('statusText');
var cellRef=document.getElementById('cellRef');
var msg=document.getElementById('gameMsg');

function parseLevel(spec){
  // 归一到统一宽度（右侧补墙），把外部空白当墙
  var w=0; spec.forEach(function(line){ if(line.length>w) w=line.length; });
  rows=spec.length; cols=w;
  grid=[]; boxes=[]; solved=false; moves=0; history=[];
  for(var r=0;r<rows;r++){
    grid[r]=[];
    var line=spec[r];
    for(var c=0;c<cols;c++){
      var ch=c<line.length?line[c]:'#'; // 越界补墙（行宽不齐时保护边界）
      var cell=0; // 地板（图内空格=可走地板）
      if(ch==='#') cell=1; // 只有 # 是墙
      else if(ch==='.'||ch==='*'||ch==='+') cell=2; // 目标
      grid[r][c]=cell;
      if(ch==='$'||ch==='*') boxes.push({r:r,c:c});
      if(ch==='@'||ch==='+'){ player.r=r; player.c=c; }
    }
  }
}

function boxAt(r,c){ for(var i=0;i<boxes.length;i++) if(boxes[i].r===r&&boxes[i].c===c) return i; return -1; }
function isWall(r,c){ return r<0||c<0||r>=rows||c>=cols||grid[r][c]===1; }
function isGoal(r,c){ return grid[r][c]===2; }

function countOnGoal(){ var n=0; boxes.forEach(function(b){ if(isGoal(b.r,b.c)) n++; }); return n; }

function pushState(){ history.push({pr:player.r,pc:player.c,boxes:boxes.map(function(b){return {r:b.r,c:b.c};}),moves:moves}); if(history.length>500) history.shift(); }

function move(dr,dc){
  if(solved) return;
  var nr=player.r+dr, nc=player.c+dc;
  if(isWall(nr,nc)) return;
  var bi=boxAt(nr,nc);
  if(bi>=0){
    // 前方是箱子，看箱子再前一格能否推
    var br=nr+dr, bc=nc+dc;
    if(isWall(br,bc)||boxAt(br,bc)>=0) return; // 推不动
    pushState();
    boxes[bi].r=br; boxes[bi].c=bc;
    player.r=nr; player.c=nc;
    moves++;
  }else{
    pushState();
    player.r=nr; player.c=nc;
    moves++;
  }
  render();
  if(countOnGoal()===boxes.length){ win(); }
}

function undo(){
  if(solved||!history.length) return;
  var s=history.pop();
  player.r=s.pr; player.c=s.pc;
  boxes=s.boxes; moves=s.moves;
  render();
}

function win(){
  solved=true;
  statusText.textContent='✓ 货位整理完成';
  document.getElementById('msgBody').innerHTML='第 <b>'+(levelIdx+1)+'</b> 关完成，共 <b>'+moves+'</b> 步。';
  document.getElementById('okBtn').textContent = (levelIdx<LEVELS.length-1)?'下一关':'重玩本关';
  msg.classList.add('show');
}

function render(){
  var html='<tr><th class="corner"></th>';
  for(var c=0;c<cols;c++) html+='<th>'+(COLNAMES[c]||(c+1))+'</th>';
  html+='</tr>';
  for(var r=0;r<rows;r++){
    html+='<tr><td class="rownum">'+(r+1)+'</td>';
    for(var c=0;c<cols;c++){
      var isP=(player.r===r&&player.c===c);
      var bi=boxAt(r,c);
      var cls='cell', txt='';
      if(grid[r][c]===1){ cls+=' wall'; }
      else if(bi>=0){
        if(isGoal(r,c)){ cls+=' boxok'; txt='📦'; }
        else { cls+=' floor'; txt='📦'; }
      }
      else if(isP){ cls+=(isGoal(r,c)?' goal':' floor'); txt='🧍'; }
      else if(grid[r][c]===2){ cls+=' goal'; txt='🎯'; }
      else { cls+=' floor'; }
      html+='<td class="'+cls+'">'+txt+'</td>';
    }
    html+='</tr>';
  }
  sheetEl.innerHTML=html;
  movesEl.textContent=moves;
  onGoalEl.textContent=countOnGoal();
  goalTotEl.textContent=boxes.length;
  levelNoEl.textContent=levelIdx+1;
  levelTotEl.textContent=LEVELS.length;
  cellRef.textContent = solved?'完成':('已入位 '+countOnGoal()+'/'+boxes.length);
  if(!solved) statusText.textContent='整理中…';
}

function loadLevel(i){
  levelIdx=(i+LEVELS.length)%LEVELS.length;
  parseLevel(LEVELS[levelIdx]);
  msg.classList.remove('show');
  render();
}

document.addEventListener('keydown',function(e){
  var k=e.key;
  if(k==='ArrowUp'||k==='w'||k==='W'){ move(-1,0); e.preventDefault(); }
  else if(k==='ArrowDown'||k==='s'||k==='S'){ move(1,0); e.preventDefault(); }
  else if(k==='ArrowLeft'||k==='a'||k==='A'){ move(0,-1); e.preventDefault(); }
  else if(k==='ArrowRight'||k==='d'||k==='D'){ move(0,1); e.preventDefault(); }
  else if(k==='u'||k==='U'){ undo(); }
  else if(k==='r'||k==='R'){ loadLevel(levelIdx); }
});

document.getElementById('undoBtn').addEventListener('click',undo);
document.getElementById('resetBtn').addEventListener('click',function(){ loadLevel(levelIdx); });
document.getElementById('prevBtn').addEventListener('click',function(){ loadLevel(levelIdx-1); });
document.getElementById('nextBtn').addEventListener('click',function(){ loadLevel(levelIdx+1); });
document.getElementById('okBtn').addEventListener('click',function(){
  if(levelIdx<LEVELS.length-1) loadLevel(levelIdx+1);
  else loadLevel(levelIdx);
});

loadLevel(0);
})();
</script>
</body>
</html>
